name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install SQLite (for tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Optional: a stable signing key. Without it every build is signed with a
      # throwaway debug key, so updates won't install over the previous APK
      # and Google Sign-In (which is tied to the key's SHA-1) won't work.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK
        run: >
          flutter build apk --release
          --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}

      - name: Show signing certificate and Google config
        env:
          CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          $APKSIGNER verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -E "SHA-1|DN:"
          # Never print any part of the value: the build log is public.
          if [ -z "$CLIENT_ID" ]; then
            echo "Google client ID: NOT SET"
          elif [[ "$CLIENT_ID" == *.apps.googleusercontent.com ]]; then
            echo "Google client ID: set and looks like a client ID"
          else
            echo "::warning::GOOGLE_SERVER_CLIENT_ID does not end in .apps.googleusercontent.com (is it the client secret?)"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cashbook-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # Opens the release APK on an Android emulator and checks the home screen
  # appears, so a build that hangs on startup is never published. Runs on its
  # own machine because the build job leaves too little disk for the emulator.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cashbook-apk
          path: build/app/outputs/flutter-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: .github/scripts/emulator_smoke_test.sh

  # Publishes the APK as a GitHub Release, so it can be downloaded straight
  # to a phone from the repository's Releases page.
  release:
    needs: smoke-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cashbook-apk

      - name: Publish release
        run: |
          mv app-release.apk Cashbook.apk
          gh release create "build-${{ github.run_number }}" Cashbook.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Cashbook build ${{ github.run_number }}" \
            --notes "APK built from ${{ github.ref_name }} @ ${GITHUB_SHA::7}. Open Cashbook.apk on your phone to install." \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
